[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "A local-first desktop application for recording and transcribing meetings."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Lei Wu" },
]
dependencies = [
  "PySide6>=6.8,<7",
  "PyAudioWPatch>=0.2.12.8,<0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.2.1,<1.3",
  "huggingface-hub>=1.0,<2",
  "tqdm>=4.67,<5",
]
diarization = [
  "pyannote.audio>=4.0.7,<4.1",
]
packaging = [
  "pyinstaller==6.20.0",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
meeting-transcriber = "meeting_transcriber.main:main"
meeting-transcriber-audio-devices = "meeting_transcriber.capture.diagnostics:main"
meeting-transcriber-capture-audit = "meeting_transcriber.capture.audit:main"
meeting-transcriber-evaluate = "meeting_transcriber.processing.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_transcriber"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
qt_api = "pyside6"
