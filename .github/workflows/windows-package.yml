name: Desktop packages

on:
  pull_request:
    paths:
      - ".github/workflows/windows-package.yml"
      - "native/macos/**"
      - "packaging/**"
      - "scripts/build_macos.sh"
      - "scripts/build_windows.ps1"
      - "scripts/build_installer.ps1"
      - "scripts/generate_icon.py"
      - "scripts/generate_macos_icon.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
  push:
    branches:
      - "codex/windows-packaging"
      - "codex/macos-support"
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-package:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked packaging dependencies
        run: uv sync --frozen --extra packaging --extra transcription

      - name: Build and smoke-test portable application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipSync

      - name: Sign application when certificate secrets are configured
        if: env.WINDOWS_SIGNING_CERTIFICATE != '' && env.WINDOWS_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "meeting-transcriber-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found." }
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD `
              "dist\Meeting Transcriber\MeetingTranscriber.exe"
            if ($LASTEXITCODE -ne 0) { throw "Application signing failed." }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Compile installer and checksums
        shell: pwsh
        run: |
          $version = (uv run python -c "from meeting_transcriber import __version__; print(__version__)").Trim()
          ./scripts/build_installer.ps1 -AppVersion $version

      - name: Sign installer when certificate secrets are configured
        if: env.WINDOWS_SIGNING_CERTIFICATE != '' && env.WINDOWS_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "meeting-transcriber-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            $installer = Get-ChildItem "dist\installer\*-Setup.exe" | Select-Object -First 1
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD `
              $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Refresh checksums after optional signing
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem "dist\installer" -File |
            Where-Object { $_.Extension -in ".exe", ".zip" }
          $lines = foreach ($artifact in $artifacts | Sort-Object Name) {
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content "dist\installer\SHA256SUMS.txt" -Encoding ascii

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/installer/*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: meeting-transcriber-windows-${{ github.run_id }}
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30

  macos-package:
    name: Build macOS ${{ matrix.architecture }} download
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      QT_QPA_PLATFORM: offscreen
      MEETING_TRANSCRIBER_ARCH_LABEL: ${{ matrix.architecture }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked macOS packaging dependencies
        run: uv sync --frozen --extra dev --extra packaging --extra transcription

      - name: Run macOS regression tests
        run: uv run --frozen pytest -q

      - name: Compile native capture helper and package application
        run: bash scripts/build_macos.sh --skip-sync

      - name: Attest macOS release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/macos/*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: meeting-transcriber-macos-${{ matrix.architecture }}-${{ github.run_id }}
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-package
      - macos-package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: meeting-transcriber-*-${{ github.run_id }}
          path: release-input

      - name: Assemble release files and unified checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find release-input -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) \
            -exec cp '{}' release-assets/ \;
          if [[ "$(find release-assets -type f | wc -l)" -ne 6 ]]; then
            echo "Expected two Windows and four macOS release files." >&2
            find release-input -type f -print >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Attest combined release files
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish tagged GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_arguments=(
            release create "${{ github.ref_name }}" release-assets/*
            --generate-notes --verify-tag
          )
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            release_arguments+=(--prerelease)
          fi
          gh "${release_arguments[@]}"
